# -----------------------------------------------------------------------------
# Workflow: Release Automation
# Description: Cross-compiles platform binaries and publishes a GitHub Release.
# Triggers: Version tags (v*.*.*), manual dispatch.
# Outputs: Signed release artifacts attached to an official GitHub Release.
# -----------------------------------------------------------------------------

name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Get version
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Build Linux AMD64
              env:
                  VERSION: ${{ steps.version.outputs.VERSION }}
              run: |
                  mkdir -p bin
                  go build -ldflags "-X main.Version=$VERSION" -o bin/sentinel-linux-amd64

            - name: Upload Linux artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-linux-amd64
                  path: bin/sentinel-linux-amd64

    build-windows:
        name: Build Windows
        runs-on: windows-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Get version
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $env:GITHUB_OUTPUT

            - name: Build Windows AMD64
              env:
                  VERSION: ${{ steps.version.outputs.VERSION }}
              run: |
                  mkdir -p bin
                  go build -ldflags "-X main.Version=$env:VERSION" -o bin/sentinel-windows-amd64.exe

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-windows-amd64
                  path: bin/sentinel-windows-amd64.exe

    release:
        name: Create GitHub Release
        needs: [build-linux, build-windows]
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Display artifacts
              run: ls -R artifacts

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: artifacts/*
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
