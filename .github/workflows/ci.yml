# -----------------------------------------------------------------------------
# Workflow: Continuous Integration (CI)
# Description: Validates code quality, executes test suites, and builds binaries.
# Triggers: Push/PR to master, manual dispatch.
# Outputs: Compiled platform binaries (Linux/Windows) and test coverage reports.
# -----------------------------------------------------------------------------

name: Continous Integration (test-lint-build)

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
            - name: Check out code
              uses: actions/checkout@v4
            - name: Download dependencies
              run: go mod download
            - name: Run tests
              run: go test -v -race -coverprofile=coverage.out ./...
            - name: Upload coverage
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.out

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                  version: latest

    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        needs: [test, lint]
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
            - name: Build Linux AMD64
              run: go build -o bin/sentinel-linux-amd64
            - name: Upload Linux artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-linux-amd64
                  path: bin/sentinel-linux-amd64

    build-windows:
        name: Build Windows
        runs-on: windows-latest
        needs: [test, lint]
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
            - name: Build Windows AMD64
              run: go build -o bin/sentinel-windows-amd64.exe
            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-windows-amd64
                  path: bin/sentinel-windows-amd64.exe
